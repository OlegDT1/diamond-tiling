<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Diamond Tiling mark, derived by measurement from the wordmark logo in
       /public/assets/logo-white.png so the tab and the header share one identity.
         · Diamond proportion: 17 x 21 = 0.810 W:H (measured logo value 0.806)
         · Sharp mitered points, matching the wordmark's corners
         · Tapered horizontal wings from the side vertices, as in the wordmark
       Two deliberate deviations, both required at tab size:
         · The wordmark type is omitted — it cannot resolve at 16px.
         · The logo's stroke is a hairline (2.26% of diamond height, which would
           scale to 0.47 units here and disappear). Thickened to 1.6 for
           legibility — standard optical compensation at favicon sizes.
       Dark rounded plate keeps the gold readable on light and dark tab bars. -->
  <rect width="32" height="32" rx="6" fill="#0a0a0a"/>
  <g fill="none" stroke="#c8a35b" stroke-linejoin="miter" stroke-miterlimit="12">
    <path d="M16 5.5 24.5 16 16 26.5 7.5 16Z" stroke-width="1.6"/>
    <path d="M2 16h5.5M24.5 16H30" stroke-width="1.15"/>
  </g>
</svg>
